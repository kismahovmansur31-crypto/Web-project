<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Полароид Альбом</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Мои воспоминания</h1>

    <div class="grid">
        {% for i in range(1, 7) %}
        <div class="slot">
            <!-- Зона для фото (клик вызывает скрытый выбор файла) -->
            <div class="photo-area" onclick="document.getElementById('file-{{i}}').click()">
                {% if i in photos %}
                    <img src="{{ url_for('static', filename='uploads/' + photos[i]) }}?{{ range(1, 9999)|random }}">
                {% else %}
                    <div class="placeholder">+</div>
                {% endif %}
            </div>

            <!-- Форма для подписи на белом поле полароида -->
            <form action="/save_caption" method="post" style="width: 100%;">
                <input type="hidden" name="slot_id" value="{{i}}">
                <input type="text" name="caption" class="polaroid-input"
                       placeholder="Напиши что-то..."
                       value="{{ captions[i] if i in captions else '' }}"
                       onblur="this.form.submit()"
                       onclick="event.stopPropagation()">
            </form>

            <!-- Скрытая форма для самой загрузки картинки -->
            <form action="/upload" method="post" enctype="multipart/form-data" id="form-{{i}}" style="display:none;">
                <input type="file" name="photo" id="file-{{i}}" accept="image/*" onchange="document.getElementById('form-{{i}}').submit()">
                <input type="hidden" name="slot_id" value="{{i}}">
            </form>
        </div>
        {% endfor %}
    </div>
</body>
</html>
